[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Aevum Testnet is EVM Shanghai ONLY. Cancun bytecode deploys fine but reverts
# with "invalid opcode" when called, so the compiler target is hard-locked here.
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

remappings = [
    "forge-std/=lib/forge-std/src/",
]
